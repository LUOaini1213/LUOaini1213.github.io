name: Portfolio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build_cases.py --check
      - run: python scripts/check_site.py
